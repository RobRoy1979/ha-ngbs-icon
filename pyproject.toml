# Repository-level developer tooling for the NGBS iCON Home Assistant integration.
# The integration itself lives in custom_components/ngbs_icon (installed by copying),
# the protocol library in lib/pyngbsicon (published to PyPI as "pyngbsicon").

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["config", "tests/fixtures", "custom_components/ngbs_icon/_vendor"]

[tool.ruff.lint]
# Mirrors the Home Assistant core rule set so the integration reads like core code.
select = [
  "A001", "ASYNC", "B", "BLE", "C", "COM818", "D", "DTZ003", "DTZ004", "DTZ011",
  "E", "F", "FLY", "FURB", "G", "I", "INP", "ISC", "ICN001", "LOG", "N804", "N805",
  "N806", "N815", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF",
  "S102", "S103", "S107", "S108", "S301", "S306", "S307", "S313", "S314", "S315",
  "S316", "S317", "S318", "S319", "S601", "S602", "S604", "S608", "S609",
  "SIM", "SLF", "SLOT", "T100", "T20", "TC", "TID", "TRY", "UP", "W",
]
ignore = [
  "ASYNC109", "ASYNC110", "B008", "B019",
  "D202", "D203", "D213", "D406", "D407", "D417",
  "E501",
  "PLC1901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
  "PLW0108", "PLW1641", "PLW2901",
  "PT011", "PT018",
  "RUF001", "RUF012", "RUF015", "RUF043",
  "SIM102", "SIM103", "SIM108", "SIM115",
  "TC001", "TC002", "TC003", "TC006",
  "TRY003", "TRY400",
  "UP047", "UP049",
  "W191", "E111", "E114", "E117", "D206", "D300", "Q", "COM812", "COM819", "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SLF001", "PLR", "S101", "D"]
"lib/pyngbsicon/tests/**" = ["SLF001", "PLR", "S101", "D", "INP001"]  # no __init__: imported with --import-mode=importlib
"lib/pyngbsicon/src/pyngbsicon/cli.py" = ["T201"]  # a CLI prints by design
"scripts/**" = ["T201", "INP001", "S", "D"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.ngbs_icon", "pyngbsicon", "tests"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
local_partial_types = true
enable_error_code = ["ignore-without-code", "redundant-self", "truthy-iterable"]
mypy_path = "lib/pyngbsicon/src"
# custom_components.ngbs_icon is added in phase 2, when the integration package exists.
packages = ["pyngbsicon"]
exclude = ["custom_components/ngbs_icon/_vendor"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests", "lib/pyngbsicon/tests"]
pythonpath = [".", "lib/pyngbsicon/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = [".git", "config", "tests/fixtures"]
addopts = "-q -p no:cacheprovider --timeout=30 --strict-markers --import-mode=importlib"
filterwarnings = ["error::DeprecationWarning:custom_components.*"]

[tool.coverage.run]
source = ["custom_components/ngbs_icon", "lib/pyngbsicon/src/pyngbsicon"]
omit = ["custom_components/ngbs_icon/_vendor/*"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
