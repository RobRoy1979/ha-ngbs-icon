name: Feature request
description: Suggest an improvement or support for more hardware.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the situation and what is missing, rather than a solution.
    validations:
      required: true
  - type: textarea
    id: system
    attributes:
      label: Your system
      description: Controller type and firmware, number of controllers and thermostats, how heating/cooling is switched.
