name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How do you imagine it working?
  - type: textarea
    id: controller
    attributes:
      label: Does your controller expose the needed data?
      description: If you know the protocol field (see docs/protocol.md), mention it.
