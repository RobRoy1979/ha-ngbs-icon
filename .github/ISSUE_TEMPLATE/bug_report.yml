name: Bug report
description: Something does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **do not paste your SYSID, MAC address or public IP** —
        the diagnostics download below already hides them.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      description: Settings → Devices & services → NGBS iCON → the version shown on the card.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.0"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Controller firmware and hardware
      description: The firmware is shown on the controller's device page (for example 1079); iCON-1 or iCON-2.
      placeholder: "1079, iCON-1"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Device page of the controller → ⋮ → Download diagnostics, then drag the file here.
        Secrets and network details are removed automatically.
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: |
        Enable debug logging (integration card → ⋮ → Enable debug logging), reproduce the
        problem, disable it again and attach the downloaded log.
      render: text
