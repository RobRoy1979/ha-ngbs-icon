name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please attach the **diagnostics download** of the integration
        (Settings → Devices & services → NGBS iCON → ⋮ → Download diagnostics). It is already
        redacted: your SYSID, MAC and IP addresses are removed.
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.9.3"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Controller firmware (shown on the device page as "Firmware")
      placeholder: "1079"
  - type: dropdown
    id: topology
    attributes:
      label: System
      options:
        - One controller
        - Master + slave controller(s)
        - Several separate systems
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: "Enable debug logging first: Settings → Devices & services → NGBS iCON → ⋮ → Enable debug logging."
      render: text
