[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyngbsicon"
dynamic = ["version"]
description = "Asynchronous client for NGBS iCON heating/cooling controllers (local JSON/TCP protocol)"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-BUSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "RobRoy1979" }]
keywords = ["ngbs", "icon", "thermostat", "heating", "cooling", "home-automation", "home-assistant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/robroy1979/ha-ngbs-icon"
Documentation = "https://github.com/robroy1979/ha-ngbs-icon/blob/main/docs/protocol.md"
Issues = "https://github.com/robroy1979/ha-ngbs-icon/issues"
Changelog = "https://github.com/robroy1979/ha-ngbs-icon/blob/main/CHANGELOG.md"

[project.scripts]
pyngbsicon = "pyngbsicon.cli:main"

[tool.hatch.version]
path = "src/pyngbsicon/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/pyngbsicon", "tests", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyngbsicon"]
